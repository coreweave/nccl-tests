name: Build

on:
  workflow_call:
    inputs:
      folder:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      base-image:
        required: true
        type: string
      base-tag:
        required: true
        type: string
      cuda-version:
        required: true
        type: string
      nccl-version:
        required: true
        type: string
      hpcx-distribution:
        required: true
        type: string
    secrets:
      ORG_BUILDKIT_CLIENT_TOKEN:
        required: true
      BUILDKIT_CONSUMER_DOPPLER_PROJECT:
        required: true
      BUILDKIT_CONSUMER_ENDPOINT:
        required: true
      BUILDKIT_CONSUMER_AMD64_ENDPOINT:
        required: true
      BUILDKIT_CONSUMER_ARM64_ENDPOINT:
        required: true
      NCCL_CI_HARNESS_READ_TOKEN:
        required: true
      RUNNER_MLDEV_SSH_KEY:
        required: true

jobs:
  build_staging:
    name: Building staging image ${{ inputs.dockerfile }}
    runs-on: [cw]
    container: 'ghcr.io/coreweave/github-actions-images/github-base-runner:v1.6.0'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch BuildKit Client Certs
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        id: client-certs
        with:
          doppler-token: ${{ secrets.ORG_BUILDKIT_CLIENT_TOKEN }}
          doppler-project: ${{ secrets.BUILDKIT_CONSUMER_DOPPLER_PROJECT }}
          doppler-config: prod
          inject-env-vars: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1
        with:
          driver: remote
          endpoint: ${{ secrets.BUILDKIT_CONSUMER_AMD64_ENDPOINT }}
          platforms: linux/amd64
          append: |
            - endpoint: ${{ secrets.BUILDKIT_CONSUMER_ARM64_ENDPOINT }}
              platforms: linux/arm64
        env:
          BUILDER_NODE_0_AUTH_TLS_CACERT: ${{ steps.client-certs.outputs.TLS_CACERT }}
          BUILDER_NODE_0_AUTH_TLS_CERT: ${{ steps.client-certs.outputs.TLS_CERT }}
          BUILDER_NODE_0_AUTH_TLS_KEY: ${{ steps.client-certs.outputs.TLS_KEY }}
          BUILDER_NODE_1_AUTH_TLS_CACERT: ${{ steps.client-certs.outputs.TLS_CACERT }}
          BUILDER_NODE_1_AUTH_TLS_CERT: ${{ steps.client-certs.outputs.TLS_CERT }}
          BUILDER_NODE_1_AUTH_TLS_KEY: ${{ steps.client-certs.outputs.TLS_KEY }}
      - name: Get staging registry
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}-staging" >> $GITHUB_ENV
      - name: Set tag prefix
        run: |
          echo "TAG_PREFIX=${{ inputs.base-tag }}-nccl${{ inputs.nccl-version}}-" >> $GITHUB_ENV
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}
          tags: |
            type=sha,prefix=${{ env.TAG_PREFIX }},suffix=-candidate,format=short
      - name: Initialize registry credentials file
        env:
          USER: ${{ github.actor }}
          PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n '.auths."ghcr.io" = { username: env.USER, password: env.PASS }' \
          | install -m400 /dev/stdin ~/.docker/config.json
      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v6.9.0
        with:
          context: ${{ inputs.folder }}
          file: ${{ inputs.folder }}/${{ inputs.dockerfile }}
          build-args: |-
            BASE_IMAGE=${{ inputs.base-image }}:${{ inputs.base-tag }}
            CUDA_VERSION=${{ inputs.cuda-version }}
            TARGET_NCCL_VERSION=${{ inputs.nccl-version }}
            HPCX_DISTRIBUTION=${{ inputs.hpcx-distribution }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
      - name: Clear registry credentials
        if: always()
        run: |
          rm -f ~/.docker/config.json && [ ! -e ~/.docker/config.json ]
      - uses: 8BitJonny/gh-get-current-pr@2.1.3
        id: PR
        with:
          filterOutClosed: true
      - name: Comment
        if: steps.PR.outputs.number
        uses: peter-evans/create-or-update-comment@v2.1.0
        with:
          issue-number: ${{ steps.PR.outputs.number }}
          body: >
            @${{ github.triggering_actor }} Build complete, ${{ steps.docker-build.outcome }}:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Image: `${{ steps.meta.outputs.tags }}`
  test:
    name: Testing ${{ inputs.dockerfile }}
    needs: build_staging
    # GPU-labeled node in the same self-hosted pool as `build_staging`.
    # TODO: confirm this matches the actual 8xH200 runner label.
    runs-on: [cw]
    container:
      image: ${{ needs.build_staging.outputs.image-tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # --gpus all: expose all GPUs. NCCL's intra-node SHM transport needs more
      # than Docker's default 64MB /dev/shm, and pinned-memory registration
      # needs an unlimited memlock ulimit.
      options: --gpus all --shm-size=1g --ulimit memlock=-1:-1
    defaults:
      run:
        shell: bash
    steps:
      # TODO: Need to ensure the equivalent of --cpus-per-task=16 applies to the runner here to pass these tests
      - name: Check out NCCL test harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          repository: coreweave/nccl_ci_harness
          ref: dev
          token: ${{ secrets.NCCL_CI_HARNESS_READ_TOKEN }}
      - name: Run NCCL test harness
        env:
          RUNNER_MLDEV_SSH_KEY: ${{ secrets.RUNNER_MLDEV_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_URI: ${{ needs.build_staging.outputs.image-tag }}
        run: |
          set -euo pipefail
      
          apt update -qq && apt install -y -qq python3-pip git openssh-client rsync
          pip install pytest
      
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/nccl_gha_runner_key
          printf '%s\n' "$RUNNER_MLDEV_SSH_KEY" > ~/.ssh/nccl_gha_runner_key
      
          cat > ~/.ssh/config <<'EOF'
          Host 166.19.50.5
            HostName 166.19.50.5
            User nccl-gha-runner
            IdentityFile ~/.ssh/nccl_gha_runner_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
      
          Host nccl-gha-runner
            HostName 166.19.50.5
            User nccl-gha-runner
            IdentityFile ~/.ssh/nccl_gha_runner_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
            
          ssh -o BatchMode=yes nccl-gha-runner@166.19.50.5 \
            "set -euo pipefail; \
             install -d -m 700 /mnt/home/nccl-gha-runner/.config/enroot; \
             printf '%s\n' \
               'machine ghcr.io' \
               'login ${GHCR_USER}' \
               'password ${GHCR_TOKEN}' \
               > /mnt/home/nccl-gha-runner/.config/enroot/.credentials; \
             chmod 600 /mnt/home/nccl-gha-runner/.config/enroot/.credentials"

          python3 -m pytest test_plugin.py \
            -s \
            -v \
            --slurm \
            --ssh-hostname=166.19.50.5 \
            --ssh-user=nccl-gha-runner \
            --container-mounts=/mnt/home/nccl-gha-runner:/mnt/home/nccl-gha-runner \
            --container-image="${IMAGE_URI/\//#}" \
            --partition=h200 \
            --cpus-per-task=16 \
            --nodes=1 \
            --gpus-per-node=8
      
          python3 -m pytest test_nccl_perf.py \
            -s \
            -v \
            --slurm \
            --ssh-hostname=166.19.50.5 \
            --ssh-user=nccl-gha-runner \
            --container-mounts=/mnt/home/nccl-gha-runner:/mnt/home/nccl-gha-runner \
            --container-image="${IMAGE_URI/\//#}" \
            --partition=h200 \
            --cpus-per-task=16 \
            --nodes=1 \
            --gpus-per-node=8

      - name: Clear remote GHCR creds
        if: always()
        env:
          RUNNER_MLDEV_SSH_KEY: ${{ secrets.RUNNER_MLDEV_SSH_KEY }}
        run: |
          set -euo pipefail
      
          apt update -qq && apt install -y -qq openssh-client
      
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/nccl_gha_runner_key
          printf '%s\n' "$RUNNER_MLDEV_SSH_KEY" > ~/.ssh/nccl_gha_runner_key
      
          ssh -i ~/.ssh/nccl_gha_runner_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            nccl-gha-runner@166.19.50.5 \
            'rm -f /mnt/home/nccl-gha-runner/.config/enroot/.credentials'
      
          rm -f ~/.ssh/nccl_gha_runner_key
  promote:
    name: Promote tested image to prod
    needs: [build_staging, test]
    runs-on: [cw]
    container: 'ghcr.io/coreweave/github-actions-images/github-base-runner:v1.6.0'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Get prod registry
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Set tag prefix
        run: |
          echo "TAG_PREFIX=${{ inputs.base-tag }}-nccl${{ inputs.nccl-version}}-" >> $GITHUB_ENV
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}
          tags: |
            type=sha,prefix=${{ env.TAG_PREFIX }},format=short
      - name: Initialize registry credentials file
        env:
          USER: ${{ github.actor }}
          PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n '.auths."ghcr.io" = { username: env.USER, password: env.PASS }' \
          | install -m400 /dev/stdin ~/.docker/config.json
      - name: Promote candidate to prod tag
        # Copy the exact multi-arch manifest that was tested, no rebuild.
        run: |
          docker buildx imagetools create \
            -t ${{ steps.meta.outputs.tags }} \
            ${{ needs.build_staging.outputs.image-tag }}
      - name: Clear registry credentials
        if: always()
        run: |
          rm -f ~/.docker/config.json && [ ! -e ~/.docker/config.json ]
      - uses: 8BitJonny/gh-get-current-pr@2.1.3
        id: PR
        with:
          filterOutClosed: true
      - name: Comment
        if: steps.PR.outputs.number
        uses: peter-evans/create-or-update-comment@v2.1.0
        with:
          issue-number: ${{ steps.PR.outputs.number }}
          body: >
            @${{ github.triggering_actor }} Promoted tested image:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Image: `${{ steps.meta.outputs.tags }}`