name: Build

on:
  workflow_call:
    inputs:
      folder:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      base-image:
        required: true
        type: string
      base-tag:
        required: true
        type: string
      cuda-version:
        required: true
        type: string
      nccl-version:
        required: true
        type: string
      hpcx-distribution:
        required: true
        type: string
    secrets:
      ORG_BUILDKIT_CLIENT_TOKEN:
        required: true
      BUILDKIT_CONSUMER_DOPPLER_PROJECT:
        required: true
      BUILDKIT_CONSUMER_ENDPOINT:
        required: true
      BUILDKIT_CONSUMER_AMD64_ENDPOINT:
        required: true
      BUILDKIT_CONSUMER_ARM64_ENDPOINT:
        required: true
      NCCL_CI_HARNESS_READ_TOKEN:
        required: true

jobs:
  build:
    name: Building ${{ inputs.dockerfile }}
    runs-on: [cw]
    container: 'ghcr.io/coreweave/github-actions-images/github-base-runner:v1.6.0'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch BuildKit Client Certs
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        id: client-certs
        with:
          doppler-token: ${{ secrets.ORG_BUILDKIT_CLIENT_TOKEN }}
          doppler-project: ${{ secrets.BUILDKIT_CONSUMER_DOPPLER_PROJECT }}
          doppler-config: prod
          inject-env-vars: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1
        with:
          driver: remote
          endpoint: ${{ secrets.BUILDKIT_CONSUMER_AMD64_ENDPOINT }}
          platforms: linux/amd64
          append: |
            - endpoint: ${{ secrets.BUILDKIT_CONSUMER_ARM64_ENDPOINT }}
              platforms: linux/arm64
        env:
          BUILDER_NODE_0_AUTH_TLS_CACERT: ${{ steps.client-certs.outputs.TLS_CACERT }}
          BUILDER_NODE_0_AUTH_TLS_CERT: ${{ steps.client-certs.outputs.TLS_CERT }}
          BUILDER_NODE_0_AUTH_TLS_KEY: ${{ steps.client-certs.outputs.TLS_KEY }}
          BUILDER_NODE_1_AUTH_TLS_CACERT: ${{ steps.client-certs.outputs.TLS_CACERT }}
          BUILDER_NODE_1_AUTH_TLS_CERT: ${{ steps.client-certs.outputs.TLS_CERT }}
          BUILDER_NODE_1_AUTH_TLS_KEY: ${{ steps.client-certs.outputs.TLS_KEY }}
      - name: Get base registry
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Set tag prefix
        run: |
          echo "TAG_PREFIX=${{ inputs.base-tag }}-nccl${{ inputs.nccl-version}}-" >> $GITHUB_ENV
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}
          tags: |
            type=sha,prefix=${{ env.TAG_PREFIX }},format=short
      - name: Initialize registry credentials file
        env:
          USER: ${{ github.actor }}
          PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n '.auths."ghcr.io" = { username: env.USER, password: env.PASS }' \
          | install -m400 /dev/stdin ~/.docker/config.json
      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v6.9.0
        with:
          context: ${{ inputs.folder }}
          file: ${{ inputs.folder }}/${{ inputs.dockerfile }}
          build-args: |-
            BASE_IMAGE=${{ inputs.base-image }}:${{ inputs.base-tag }}
            CUDA_VERSION=${{ inputs.cuda-version }}
            TARGET_NCCL_VERSION=${{ inputs.nccl-version }}
            HPCX_DISTRIBUTION=${{ inputs.hpcx-distribution }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
      - name: Clear registry credentials
        if: always()
        run: |
          rm -f ~/.docker/config.json && [ ! -e ~/.docker/config.json ]
      - uses: 8BitJonny/gh-get-current-pr@2.1.3
        id: PR
        with:
          filterOutClosed: true
      - name: Comment
        if: steps.PR.outputs.number
        uses: peter-evans/create-or-update-comment@v2.1.0
        with:
          issue-number: ${{ steps.PR.outputs.number }}
          body: >
            @${{ github.triggering_actor }} Build complete, ${{ steps.docker-build.outcome }}:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Image: `${{ steps.meta.outputs.tags }}`
  test:
    name: Testing ${{ inputs.dockerfile }}
    needs: build
    # GPU-labeled node in the same self-hosted pool as `build`.
    # TODO: confirm this matches the actual 8xH200 runner label.
    runs-on: [cw]
    container:
      image: ${{ needs.build.outputs.image-tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # --gpus all: expose all GPUs. NCCL's intra-node SHM transport needs more
      # than Docker's default 64MB /dev/shm, and pinned-memory registration
      # needs an unlimited memlock ulimit.
      options: --gpus all --shm-size=1g --ulimit memlock=-1:-1
    defaults:
      run:
        shell: bash
    steps:
      # TODO: Add some checker for cuda version to install (or verify we want 12.9)
      # TODO: Install pytest and torch from the repo's requirements.txt file once the correct version is formalized
      # TODO: Need to ensure the equivalent of --cpus-per-task=16 applies to the runner here to pass these tests
      - name: Check out NCCL test harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          repository: coreweave/nccl_ci_harness
          ref: dev
          token: ${{ secrets.NCCL_CI_HARNESS_READ_TOKEN }}
      - name: Run NCCL test harness
        run: |
          # install git, python and pip, no-op'ing if already installed
          apt update -qq && apt install -y -qq python3-pip git

          _cuda_vers=$(nvidia-smi | sed -En 's#.*CUDA Version: ([0-9.]+).*#\1#p')
          cuda_vers=${_cuda_vers//./}

          pip install pytest
          pip install torch --index-url "https://download.pytorch.org/whl/cu${cuda_vers}"

          python3 -m pytest test_plugin.py \
            -s \
            -v \
            --cpus-per-task=16 \
            --nodes=1 \
            --gpus-per-node=8

          python3 -m pytest test_nccl_perf.py \
            -s \
            -v \
            --cpus-per-task=16 \
            --nodes=1 \
            --gpus-per-node=8
