name: Build

on:
  workflow_call:
    inputs:
      folder:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      base-image:
        required: true
        type: string
      base-tag:
        required: true
        type: string
      output-tag:
        required: false
        default: ''
        type: string
      cuda-version:
        required: true
        type: string
      nccl-version:
        required: true
        type: string
      hpcx-distribution:
        required: true
        type: string
    outputs:
      outcome:
        description: "The outcome of the build"
        value: ${{ jobs.merge.outputs.outcome }}
      tags:
        description: "The resulting image tags"
        value: ${{ jobs.merge.outputs.tags }}
      version:
        description: "The resulting image version"
        value: ${{ jobs.merge.outputs.version }}

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare
    runs-on: cw-static-pub-x64-4c
    env:
      DOCKER_METADATA_SHORT_SHA_LENGTH: 7
    defaults:
      run:
        shell: bash
    outputs:
      registry: ${{ steps.registry.outputs.value }}
      image: ${{ steps.registry.outputs.image }}
      variant: ${{ steps.variant.outputs.value }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Compute registry
        id: registry
        run: |
          echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Compute variant
        id: variant
        env:
          TAG: ${{ inputs.output-tag || inputs.base-tag }}
          NCCL_VERSION: ${{ inputs.nccl-version }}
        run: |
          echo "value=${TAG}-nccl${NCCL_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=sha,prefix=${{ steps.variant.outputs.value }}-,format=short

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ml-amd
            arch: amd64
          - platform: linux/arm64
            runner: ml-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    outputs:
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          driver: remote
          endpoint: unix:///run/buildkit/buildkitd.sock
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute cache key
        id: cache
        run: |
          KEY="${{ matrix.arch }}-${{ needs.prepare.outputs.variant }}"
          echo "ref=${{ needs.prepare.outputs.registry }}/buildcache:${KEY}" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: docker-build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ inputs.folder }}
          file: ${{ inputs.folder }}/${{ inputs.dockerfile }}
          build-args: |-
            BASE_IMAGE=${{ inputs.base-image }}:${{ inputs.base-tag }}
            CUDA_VERSION=${{ inputs.cuda-version }}
            TARGET_NCCL_VERSION=${{ inputs.nccl-version }}
            HPCX_DISTRIBUTION=${{ inputs.hpcx-distribution }}
            REPORTER_IMAGE=${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
          labels: ${{ needs.prepare.outputs.labels }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ needs.prepare.outputs.image }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max
      - name: Export digest
        id: export
        run: echo "digest-${{ matrix.arch }}=${{ steps.docker-build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  merge:
    name: Merge Manifests
    needs: [prepare, build]
    runs-on: cw-static-pub-x64-4c
    defaults:
      run:
        shell: bash
    outputs:
      outcome: ${{ steps.push.outcome }}
      tags: ${{ needs.prepare.outputs.tags }}
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        id: push
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          EXPECTED_ARCHES: '["amd64","arm64"]'
          DIGEST_AMD64: ${{ needs.build.outputs.digest-amd64 }}
          DIGEST_ARM64: ${{ needs.build.outputs.digest-arm64 }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=('-t' "$tag")
            fi
          done <<< "$TAGS"

          if [[ "${#tag_args[@]}" -eq 0 ]]; then
            echo '::error::No tags produced from metadata'
            exit 1
          fi

          mapfile -d '' -t digest_args < <(
            printf '%s' "$EXPECTED_ARCHES" | jq -j \
              --arg image "$IMAGE" \
              --arg amd64 "$DIGEST_AMD64" \
              --arg arm64 "$DIGEST_ARM64" '
              {amd64: $amd64, arm64: $arm64} as $d |
              .[] |
              if $d[.] == "" then
                error("Missing digest for expected architecture: \(.)")
              else
                "\($image)@\($d[.])\u0000"
              end'
          )

          if [[ "${#digest_args[@]}" -eq 0 ]]; then
            echo "::error::No digest arguments produced. Expected architectures: $EXPECTED_ARCHES"
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

          DIGEST=$(docker buildx imagetools inspect "${tag_args[1]}" --format '{{println .Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Gather job summary
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          BUILD_ARGS: |-
            BASE_IMAGE=${{ inputs.base-image }}:${{ inputs.base-tag }}
            CUDA_VERSION=${{ inputs.cuda-version }}
            TARGET_NCCL_VERSION=${{ inputs.nccl-version }}
            HPCX_DISTRIBUTION=${{ inputs.hpcx-distribution }}
        run: |
          {
            printf '## Built image info\n\n' && \
            printf '### Image\n\n```text\n%s\n```\n\n' "${TAGS:-Missing}" && \
            printf 'Digest: `%s`\n\n' "${DIGEST:-Missing}" && \
            if [ -n "${BUILD_ARGS}" ]; then
              printf '<details>\n<summary><h3>Build args</h3></summary>\n\n```ini\n%s\n```\n\n</details>\n' \
                "${BUILD_ARGS}";
            fi;
          } >> "${GITHUB_STEP_SUMMARY}"
