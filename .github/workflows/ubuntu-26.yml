name: Ubuntu 26

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .github/workflows/ubuntu-26.yml
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

jobs:
  cu133:
    uses: ./.github/workflows/build.yml
    with:
      folder: .
      dockerfile: Dockerfile
      base-image: nvidia/cuda
      base-tag: 13.3.1-devel-ubuntu26.04
      cuda-version: "13.3.1"
      nccl-version: 2.32.6-1
      hpcx-distribution: "hpcx-v2.51-gcc-doca_ofed-ubuntu26.04-cuda13"

  cu134:
    uses: ./.github/workflows/build.yml
    with:
      folder: .
      dockerfile: Dockerfile
      base-image: nvidia/cuda
      base-tag: 13.4.3-devel-ubuntu26.04
      cuda-version: "13.4.3"
      nccl-version: 2.32.6-1
      hpcx-distribution: "hpcx-v2.51-gcc-doca_ofed-ubuntu26.04-cuda13"

  cu135:
    uses: ./.github/workflows/build.yml
    with:
      folder: .
      dockerfile: Dockerfile
      base-image: nvidia/cuda
      base-tag: 13.5.0-devel-ubuntu26.04
      cuda-version: "13.5.0"
      nccl-version: 2.32.6-1
      hpcx-distribution: "hpcx-v2.51-gcc-doca_ofed-ubuntu26.04-cuda13"

  comment:
    needs: [cu133, cu134, cu135]
    if: always()
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/comment.yml
    with:
      results: ${{ toJSON(needs) }}
