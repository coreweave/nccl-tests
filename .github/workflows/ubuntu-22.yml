      folder: .
      dockerfile: Dockerfile
      base-image: nvidia/cuda
      base-tag: 12.6.3-devel-ubuntu22.04
      cuda-version: "12.6.3"
      nccl-version: 2.32.6-1
      hpcx-distribution: "hpcx-v2.51-gcc-doca_ofed-ubuntu22.04-cuda12"

  cu128:
